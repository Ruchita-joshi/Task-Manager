<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 Task Manager</h1>
      <p class="subtitle">A Simple Full Stack Application</p>
    </header>

    <main>
      <!-- Input Section -->
      <section class="input-section">
        <input 
          type="text" 
          id="taskInput" 
          placeholder="Enter a new task..." 
          class="task-input"
        >
        <button id="addBtn" class="btn btn-primary">Add Task</button>
      </section>

      <!-- Status Message -->
      <div id="message" class="message hidden"></div>

      <!-- Tasks List -->
      <section class="tasks-section">
        <h2>Your Tasks</h2>
        <ul id="taskList" class="task-list">
          <li class="loading">Loading tasks...</li>
        </ul>
      </section>

      <!-- Stats -->
      <section class="stats">
        <div class="stat-item">
          <span class="stat-label">Total Tasks:</span>
          <span id="totalCount" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Completed:</span>
          <span id="completedCount" class="stat-value">0</span>
        </div>
      </section>
    </main>

    <footer>
      <p>Simple Full Stack Application | Frontend + Backend</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
